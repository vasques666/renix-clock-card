name: Bug report
description: Report a problem with Renix Clock Card
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem with Renix Clock Card!

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe what is not working.
      placeholder: Tell us what happened...
    validations:
      required: true

  - type: textarea
    id: configuration
    attributes:
      label: Card configuration
      description: Paste your Renix Clock Card YAML configuration.
      render: yaml

  - type: input
    id: home_assistant
    attributes:
      label: Home Assistant version
      placeholder: "2026.x.x"

  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: "Chrome / Safari / Firefox"

  - type: textarea
    id: logs
    attributes:
      label: Browser console errors
      description: Paste any relevant errors from the browser console.
      render: text
